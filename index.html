<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#102d3b"><title>中国音乐文化术语英译与阐释知识库</title>
<style>
:root{--navy:#122f3e;--teal:#196e73;--line:#dde5e8;--muted:#61717d;--cream:#f8f9f6;--card:#fff;--ink:#192f39}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);background:var(--cream);line-height:1.75}button,input{font:inherit}.hero{background:var(--navy);color:white;padding:42px max(24px,calc((100vw - 1150px)/2)) 38px}.eyebrow{font-size:12px;letter-spacing:.16em;color:#8bd2cc}.hero h1{font-size:clamp(25px,3vw,37px);font-weight:650;letter-spacing:.04em;line-height:1.35;margin:11px 0}.subtitle{color:#d1dfe1;font-size:14px}.main{max-width:1150px;margin:0 auto;padding:24px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px}.sidebar{align-self:start;position:sticky;top:18px;background:white;padding:20px;border:1px solid var(--line);border-radius:12px}.sidebar label{font-size:13px;font-weight:600}.search{width:100%;padding:11px;border:1px solid #becdd2;border-radius:8px;margin:8px 0 18px;outline-color:var(--teal)}.term-list{display:flex;flex-direction:column;gap:7px}.term-button{width:100%;text-align:left;border:1px solid var(--line);background:white;color:var(--ink);padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between}.term-button:hover{border-color:var(--teal)}.term-button.selected{background:#e4f1ef;color:#10565a;border-color:#80b2ae;font-weight:700}.term-button small{font-weight:400;color:var(--muted)}.hint{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.content{min-width:0}.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:25px;margin-bottom:18px;box-shadow:0 2px 10px #142b3806}.term-name{font-size:33px;margin:0}.roman{font-size:14px;color:var(--teal);margin-left:12px}.meta{font-size:13px;color:var(--muted)}.section-head{font-size:18px;margin:0 0 16px;font-weight:650}.counts{font-size:13px;color:var(--muted)}.desc{white-space:pre-wrap}.concept{padding:15px 0;border-top:1px solid var(--line)}.concept:first-of-type{border-top:0;padding-top:0}.concept-name{font-weight:650;color:#164e55}.concept-def{margin:5px 0 0;white-space:pre-wrap}.note{font-size:13px;color:var(--muted)}details.case{border:1px solid var(--line);border-radius:9px;margin:12px 0;overflow:hidden;background:white}details.case>summary{cursor:pointer;list-style:none;padding:15px 18px;font-weight:620;display:flex;gap:12px;align-items:start;justify-content:space-between}details.case>summary::-webkit-details-marker{display:none}details.case>summary:after{content:'＋';font-size:18px;color:var(--teal)}details.case[open]>summary:after{content:'－'}details.case[open]>summary{background:#f0f6f4;border-bottom:1px solid var(--line)}.case-number{font-weight:700;color:var(--teal);font-size:12px;white-space:nowrap;padding-top:4px}.case-title{flex:1;overflow-wrap:anywhere}.case-body{padding:20px}.source{background:#f6f8f8;padding:13px 15px;border-radius:8px;font-size:13px}.source>div{margin:3px 0;overflow-wrap:anywhere}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.text-pane{border:1px solid var(--line);border-radius:8px;padding:15px;min-width:0}.text-pane h4{margin:0 0 10px;font-size:14px;color:var(--teal)}.prose{white-space:pre-wrap;font-size:14px;overflow-wrap:anywhere}.analysis{margin-top:16px;padding-top:15px;border-top:1px solid var(--line)}.analysis h4{color:var(--teal);margin:0 0 8px}.empty{color:var(--muted);font-size:14px}.footer{max-width:1150px;margin:auto;padding:0 24px 32px;color:var(--muted);font-size:12px}.status{padding:50px 16px;text-align:center}.pill{display:inline-block;padding:2px 9px;border-radius:15px;background:#e9f2f0;color:#2d6768;font-size:12px}.jump{cursor:pointer;background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:12px;color:var(--teal)}.jump:focus-visible,.term-button:focus-visible{outline:3px solid #71c6ca} @media(max-width:730px){.hero{padding:30px 20px}.main{grid-template-columns:1fr;padding:14px;gap:14px}.sidebar{position:static;padding:15px}.term-list{flex-direction:row;flex-wrap:wrap}.term-button{width:auto;min-width:72px;gap:12px}.panel{padding:18px}.columns{grid-template-columns:1fr;gap:12px}.footer{padding:0 16px 25px}}
</style></head>
<body><header class="hero"><div class="eyebrow">CHINESE MUSIC TERMINOLOGY · PILOT EDITION</div><h1>中国音乐文化术语英译与阐释知识库</h1><div class="subtitle">中文概念 · 英文用例 · 参考译文 · 音乐案例评析　｜　四术语试验版</div></header>
<div class="main"><aside class="sidebar"><label for="keyword">检索中文术语及材料</label><input id="keyword" class="search" type="search" placeholder="输入术语或关键词" autocomplete="off"><div id="termList" class="term-list" aria-label="术语列表"></div><div class="hint">本网站为公开只读展示。资料源于研究团队整理的试验数据库，未审核内容不代表规范译名。<br>部分中文译文为研究参考译文。</div></aside><main id="content" class="content"><div class="status">正在读取资料……</div></main></div><footer class="footer">四术语试验版 · 由SQLite导出为静态网页 · 页面不提供在线编辑功能</footer>
<script>
'use strict';
let DATA, terms=[],selected=null;
const $=id=>document.getElementById(id);
const clean=v=>v==null||['NULL','留空'].includes(String(v).trim())?'':String(v);
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
const add=(parent,tag,cls,text)=>{const n=el(tag,cls,text);parent.appendChild(n);return n};
const by=(field,id,arr)=>arr.filter(x=>x[field]===id);
const order=['意','象','意象','写意'];
function renderList(){let q=$('keyword').value.trim().toLowerCase(),list=$('termList');list.replaceChildren();let matches=terms.filter(t=>{let corpus=[t.chinese_term,t.pinyin,t.general_note,...by('term_id',t.term_id,DATA.Concepts).map(x=>x.concept_name+' '+x.definition),...by('term_id',t.term_id,DATA.Examples).map(x=>x.english_text+' '+x.chinese_translation+' '+x.notes)].join(' ').toLowerCase();return corpus.includes(q)});for(let t of matches){let b=add(list,'button','term-button'+(t.term_id===selected?' selected':''));b.type='button';b.setAttribute('aria-current',t.term_id===selected?'true':'false');add(b,'span','',t.chinese_term);add(b,'small','',t.pinyin||'');b.addEventListener('click',()=>{selected=t.term_id;history.replaceState(null,'','#'+encodeURIComponent(t.chinese_term));renderList();renderTerm();window.scrollTo({top:0,behavior:'smooth'})})}if(!matches.length)add(list,'p','empty','没有找到匹配的术语。')}
function renderTerm(){let root=$('content');root.replaceChildren();let t=terms.find(x=>x.term_id===selected);if(!t){add(root,'p','empty','请选择一个术语');return}let head=add(root,'section','panel');let name=add(head,'h2','term-name',t.chinese_term);add(name,'span','roman',clean(t.pinyin));add(head,'div','meta',clean(t.domain));if(clean(t.general_note))add(head,'p','desc',t.general_note);let cpts=by('term_id',t.term_id,DATA.Concepts), ex=by('term_id',t.term_id,DATA.Examples);let pane=add(root,'section','panel');add(pane,'h3','section-head','一、中文含义与概念义项');add(pane,'p','counts',`共 ${cpts.length} 个义项`);for(let c of cpts){let div=add(pane,'div','concept');add(div,'div','concept-name',clean(c.concept_name));add(div,'p','concept-def',clean(c.definition)||'暂无定义');for(let k of ['domain_context','historical_context'])if(clean(c[k]))add(div,'div','note',clean(c[k]))}let c=add(root,'section','panel');add(c,'h3','section-head','二、英文用例与音乐案例');add(c,'p','counts',`共 ${ex.length} 条用例／选例；展开条目阅读英文、译文和评析`);let srcMap=new Map(DATA.Sources.map(s=>[s.source_id,s]));for(let [i,x] of ex.entries()){let s=srcMap.get(x.source_id)||{},intps=by('example_id',x.example_id,DATA.Interpretations);let details=add(c,'details','case');if(ex.length===1)details.open=true;let sum=add(details,'summary');add(sum,'span','case-number',`用例 ${i+1}`);add(sum,'span','case-title',clean(s.title)||'来源待核对');let body=add(details,'div','case-body');let src=add(body,'div','source');for(let [label,v] of [['来源',s.title],['作者／机构',s.author_org],['出版或发布机构',s.publication],['年份',s.year],['来源类型',s.source_type],['出处说明',s.citation_note],['原稿页码',x.page_number]])if(clean(v))add(src,'div','',`${label}：${v}`);let cols=add(body,'div','columns');for(let [title,v] of [['英文原文',x.english_text],['中文参考译文',x.chinese_translation]]){let p=add(cols,'div','text-pane');add(p,'h4','',title);add(p,'div','prose',clean(v)||'暂无内容')}if(clean(x.notes)){let note=add(body,'div','analysis');add(note,'h4','','用例说明／原典备注');add(note,'div','prose',x.notes)}for(let it of intps){let sec=add(body,'div','analysis');add(sec,'h4','',clean(it.interpretation_type)||'学术评析');add(sec,'div','prose',clean(it.interpretation_text)||'暂无评析')}}let solo=DATA.Interpretations.filter(x=>x.term_id===t.term_id&&x.example_id==null);if(solo.length){let box=add(root,'section','panel');add(box,'h3','section-head','三、术语总体阐释');for(let it of solo){add(box,'h4','',clean(it.interpretation_type)||'总体阐释');add(box,'div','prose',clean(it.interpretation_text))}}}
fetch('./data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(data=>{DATA=data;terms=(data.Terms||[]).slice().sort((a,b)=>{let x=order.indexOf(a.chinese_term),y=order.indexOf(b.chinese_term);return (x<0?99:x)-(y<0?99:y)});let slug=decodeURIComponent(location.hash.slice(1));selected=(terms.find(t=>t.chinese_term===slug)||terms[0])?.term_id;renderList();renderTerm();$('keyword').addEventListener('input',renderList)}).catch(err=>{$('content').replaceChildren();add($('content'),'div','panel',`无法加载 data.json（${err.message}）。请通过GitHub Pages访问，或用本地HTTP服务器预览，直接双击index.html可能受到浏览器文件访问限制。`)});
</script></body></html>
